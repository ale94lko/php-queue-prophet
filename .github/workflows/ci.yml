name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit
        if: matrix.php != '8.3'
        run: vendor/bin/phpunit --colors=always

      - name: PHPUnit with coverage
        if: matrix.php == '8.3'
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --colors=always --coverage-text --coverage-clover=coverage/clover.xml

      - name: Enforce ≥95% line coverage
        if: matrix.php == '8.3'
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            $metrics = $xml->project->metrics;
            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $pct = $statements > 0 ? ($covered / $statements) * 100 : 0;
            printf("Line coverage: %.2f%% (%d/%d)\n", $pct, $covered, $statements);
            if ($pct < 95.0) {
                fwrite(STDERR, "Coverage below 95% threshold.\n");
                exit(1);
            }
          '
